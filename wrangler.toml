# Cloudflare Worker: myseasons-api. Wordt automatisch gedeployd via GitHub Actions
# (.github/workflows/worker-deploy.yml) zodra worker/** of dit bestand verandert.
# Secrets (HIGHLIGHTLY_KEY) en de tekstvariabele ALLOWED_UID staan in Cloudflare en blijven bewaard.

name = "myseasons-api"
main = "worker/myseasons-api.js"
compatibility_date = "2024-09-23"
workers_dev = true
keep_vars = true # ALLOWED_UID uit het dashboard niet weggooien bij een deploy

# Nachtploeg: brievenbus en wachtrij. Het id komt uit Cloudflare → Storage & Databases → KV.
[[kv_namespaces]]
binding = "MS_KV"
id = "86e36cdf309e4aaf89e5714f128711e2"

# Wekker: elke minuut; de Worker bepaalt zelf of er gedraaid wordt (stand Uit / Gratis / Turbo).
[triggers]
crons = ["* * * * *"]

# Opslag voor wat vaak verandert (nachtploeg, brievenbus, live): D1, gratis 100.000 rijen schrijven per dag.
# Zie worker/hybrid.js. Het id is geen geheim (net als het KV-id).
[[d1_databases]]
binding = "DB"
database_name = "myseasons"
database_id = "56f32c0a-a9e9-4d74-8f94-50702db3fcff"
